name: CI

# Cek setiap push/PR: go vet, build, dan test.
# Push ke main yang lolos CI akan memicu "Build & Push Images" di repo infrastructure
# (butuh secret INFRA_DISPATCH_TOKEN; kalau belum diisi, langkah ini dilewati).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/server ./cmd/simpeg

      - name: Test
        run: go test ./...

  trigger-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build ke repo infrastructure
        env:
          TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          REPO: ${{ github.repository_owner }}/ponpes-mardhotullah-infrastructure
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::INFRA_DISPATCH_TOKEN belum diisi, build image dilewati"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d "{\"event_type\":\"build\",\"client_payload\":{\"service\":\"backend\",\"ref\":\"$GITHUB_REF_NAME\"}}"
